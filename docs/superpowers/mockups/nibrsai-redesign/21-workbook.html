<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crime Data Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,600;0,700;1,400&family=Fragment+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/gqy0ylh.css"><link rel="stylesheet" href="ci.css"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="wb.css"></head>
<body>
<script type="module">
  import { app, SOURCES, sourceSelect } from "./_app.js";
  import { BALTIMORE_MVT, barChart, lineChart, table } from "./mock.js";
  app({ screen: "21-workbook", footer: false });
  document.querySelector(".Mock").innerHTML = `<a href="20-start.html">Start</a><a href="21-workbook.html" class="on">Answers: list</a><a href="23-tabs.html">Answers: tabs</a>`;
  const yearly = []; { const y = {}; for (const r of BALTIMORE_MVT) if (r.x < "2026") y[r.x.slice(0, 4)] = (y[r.x.slice(0, 4)] ?? 0) + r.y; for (const [x, v] of Object.entries(y)) yearly.push({ x, y: v }); }

  // The conversation; one answer on screen at a time. `q` is the question the engine answered (P69); `typed` what was written; `parent` the answer a
  // follow-up builds on; `from` the answer an edit was made from. Notes are the engine's text lines after the first,
  // the source last. A single number is the answer sentence, with no chart or table.
  const sheets = [
    { kind: "month", typed: "Car thefts in Baltimore by month since 2022", q: "Motor vehicle theft offenses in Baltimore, Maryland, by month, January 2022 through June 2026",
      notes: ["\"Car thefts\" read as motor vehicle theft (NIBRS offense 240), completed and attempted."] },
    { kind: "year", parent: 0, typed: "by year", q: "Motor vehicle theft offenses in Baltimore, Maryland, by year, 2022 to 2025", notes: [] },
    { kind: "number", parent: 1, typed: "how many in 2025", q: "Motor vehicle theft offenses in Baltimore, Maryland, in 2025",
      sentence: "Baltimore, Maryland: <b>4,418</b> motor vehicle theft offenses in 2025.", notes: [] },
    { kind: "clarify", q: "Shoplifting in Baltimore by month from 2022 to 2025" },
  ];
  let active = 2; // the answer on screen
  let ctx = 2; // the answer the next question follows up on; null for a new question

  document.body.insertAdjacentHTML("beforeend", `
  <div class="Bar"><div class="BarInner">
    <a class="home" href="20-start.html" title="Start"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8l6-5 6 5v7H3z"/></svg></a>
    <span id="ctx"></span>
    <input id="q" placeholder="Ask a question">${sourceSelect("Auto")}<button class="Btn Btn-dark Btn-teal" id="ask">Ask</button>
    <span class="tut" style="display:flex;gap:.5rem"><button class="Btn Btn-outlined" style="height:2.75rem">Download all</button><button class="Btn Btn-outlined" style="height:2.75rem">Tutorial</button></span>
  </div></div>
  <div class="Work single" id="work" style="--src:${SOURCES.nibrs.color}">
    <aside class="Rail"><div class="RailHead"><span class="t">Questions</span><button id="fold">Hide</button></div><div class="RailList" id="toc"></div></aside>
    <section class="Book single" id="book"></section>
  </div>`);

  const book = document.getElementById("book"), toc = document.getElementById("toc");
  const isAnswer = (s) => ["month", "year", "number"].includes(s.kind);

  // One question box. It follows up on the selected answer, or asks a new question.
  function renderCtx() {
    document.getElementById("ctx").innerHTML = ctx === null
      ? `<span class="Ctx new">New question</span>`
      : `<span class="Ctx">Follow up on <b>answer ${ctx + 1}</b><button id="clear">New question</button></span>`;
    document.getElementById("q").placeholder = ctx === null ? "Ask a question" : "By quarter, make it a rate, same for Dallas";
    document.getElementById("clear")?.addEventListener("click", () => { ctx = null; render(); });
  }
  const select = (i) => { active = i; if (isAnswer(sheets[i])) ctx = i; render(); };

  function render() {
    renderCtx();
    toc.innerHTML = sheets.map((s, i) => `<div class="Toc ${i === active ? "on" : ""}" data-i="${i}" style="--src:${SOURCES.nibrs.color}">
      <div class="n">${i + 1} &nbsp; NIBRS</div><div class="q">${s.q}</div>
      ${s.from !== undefined ? `<div class="p">Edited from answer ${s.from + 1}</div>` : s.parent !== undefined ? `<div class="p">Follows answer ${s.parent + 1}</div>` : ""}
      ${s.kind === "clarify" ? `<div class="s">Waiting for your choice</div>` : s.kind === "pending" ? `<div class="s">Answering</div>` : ""}</div>`).join("");
    book.innerHTML = sheets.map((s, i) => { if (i !== active) return "";
      const head = `<span class="overline dot">${i + 1} &nbsp; NIBRS</span>
        ${s.typed && s.typed !== s.q ? `<div class="typed">You asked: ${s.typed}</div>` : ""}
        <div class="qh"><h2>${s.q}${isAnswer(s) ? `<a class="edit" href="#" data-edit="${i}">Edit</a>` : ""}</h2></div>
        ${s.from !== undefined ? `<div class="from">Edited from answer ${s.from + 1}</div>` : s.parent !== undefined ? `<div class="from">Follows answer ${s.parent + 1}</div>` : ""}`;
      if (s.kind === "clarify") return `<article class="Sheet" id="s${i}"><div class="SheetHead"><div>${head}</div></div>
        <p class="Number" style="font-size:1rem;margin-bottom:1rem">Two agencies match. Which one?</p>
        <div class="Choices"><button class="Choice"><span>Baltimore, Maryland</span><span class="k">City police</span></button><button class="Choice"><span>Baltimore County, Maryland</span><span class="k">County police; does not include the city</span></button></div></article>`;
      if (s.kind === "pending") return `<article class="Sheet pending" id="s${i}"><div class="SheetHead"><div>${head}</div></div><div class="wait">Answering</div></article>`;
      const tools = `Download <button class="Btn Btn-outlined">Data</button><button class="Btn Btn-outlined">Image</button><button class="Btn Btn-outlined">Link</button><button class="x">Remove</button>`;
      if (s.kind === "number") return `<article class="Sheet" id="s${i}" data-i="${i}"><div class="SheetHead"><div>${head}</div></div>
        <p class="Number">${s.sentence}</p>
        <div class="Notes2">${s.notes.map((n) => `<p>${n}</p>`).join("")}<p class="src">Source: FBI NIBRS.</p></div>
        <div class="SheetFoot"><button class="Btn Btn-outlined">Link</button><button class="x">Remove</button></div></article>`;
      return `<article class="Sheet" id="s${i}" data-i="${i}"><div class="SheetHead"><div>${head}</div></div>
        <div class="Answer"><div class="AnswerChart"><div class="Chart" id="c${i}"></div></div><div class="AnswerTable"><div class="TableScroll" id="t${i}"></div></div></div>
        <div class="Notes2">${s.notes.map((n) => `<p>${n}</p>`).join("")}${s.notes.length ? "<hr>" : ""}<p class="src">Source: FBI NIBRS.</p></div>
        <div class="SheetFoot">${tools}</div></article>`;
    }).join("");
    sheets.forEach((s, i) => {
      if (i !== active || (s.kind !== "month" && s.kind !== "year")) return;
      const rows = s.kind === "year" ? yearly : BALTIMORE_MVT, tEl = document.getElementById(`t${i}`);
      table(tEl, [s.kind === "year" ? "Year" : "Month", "Motor vehicle theft offenses"], rows.map((r) => [r.x, r.y]));
      const trs = [...tEl.querySelectorAll("tbody tr")];
      // Chart and table linked: hovering one marks the same row or point in the other.
      const mark = (j) => trs.forEach((tr, k) => tr.classList.toggle("hl", k === j));
      const draw = s.kind === "year" ? barChart : lineChart;
      const cEl = document.getElementById(`c${i}`), H = Math.max(260, Math.min(560, cEl.closest(".AnswerChart").clientHeight - 8));
      const c = draw(cEl, rows, "Motor vehicle theft offenses", "Baltimore, Maryland", H, (r, e) => pick(i, r.x, e), mark);
      trs.forEach((tr, j) => { tr.addEventListener("mouseenter", () => { c.highlight(j); mark(j); }); tr.addEventListener("mouseleave", () => { c.highlight(null); mark(null); }); tr.addEventListener("click", (e) => pick(i, rows[j].x, e)); });
    });
    toc.querySelectorAll(".Toc").forEach((t) => t.addEventListener("click", () => select(Number(t.dataset.i))));
    // Edit: the question opens in place; running it adds a new answer, and the original stays.
    book.querySelectorAll("[data-edit]").forEach((a) => a.addEventListener("click", (e) => {
      e.preventDefault(); const i = Number(a.dataset.edit), qh = a.closest(".qh");
      qh.innerHTML = `<div class="Edit"><textarea>${sheets[i].q}</textarea><div class="row"><button class="Btn Btn-dark Btn-teal">Run as a new answer</button><button class="Btn Btn-outlined" style="height:2.75rem">Cancel</button></div></div>`;
      const [run, cancel] = qh.querySelectorAll("button");
      run.addEventListener("click", () => { sheets.push({ kind: "pending", from: i, q: qh.querySelector("textarea").value }); scrollEnd(); });
      cancel.addEventListener("click", render);
    }));
  }
  const scrollEnd = () => { active = sheets.length - 1; render(); };

  // Click-to-ask: only questions this source can answer for this measure. Motor vehicle theft is a property crime,
  // counted by offense (P11), so no victim breakdowns are offered; a person crime would add victim sex, age and race.
  const OPS = {
    property: (w, year) => [
      ...(year ? [["By month", `by month, ${w}`]] : [["The whole year by month", `by month, ${w.slice(-4)}`]]),
      ["By location type", `by location type, ${w}`], ["Share cleared", `share cleared, ${w}`], ["Arrests", `arrests, ${w}`],
      ["Rate per 100,000 residents", `per 100,000 residents, ${w}`], ["Compare with Baltimore County", `compared with Baltimore County, ${w}`], ["Maryland", `in Maryland, ${w}`]],
  };
  const M = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function pick(i, x, e) {
    document.querySelector(".Pick")?.remove();
    const w = x.length === 7 ? `${M[Number(x.slice(5)) - 1]} ${x.slice(0, 4)}` : x, opts = OPS.property(w, x.length === 4);
    const box = document.createElement("div"); box.className = "Pick";
    box.innerHTML = `<div class="head"><div class="t">Baltimore, ${w}</div><div class="s">Motor vehicle theft offenses</div></div><ul>${opts.map(([l], k) => `<li data-k="${k}">${l}</li>`).join("")}</ul>`;
    document.body.appendChild(box);
    const r = box.getBoundingClientRect(); box.style.left = `${Math.min(e.clientX + 12, innerWidth - r.width - 12)}px`; box.style.top = `${Math.min(e.clientY + 12, innerHeight - r.height - 12)}px`;
    box.querySelectorAll("li").forEach((li) => li.addEventListener("click", () => {
      box.remove(); const [, tail] = opts[Number(li.dataset.k)];
      sheets.push({ kind: "pending", parent: i, q: `Motor vehicle theft offenses in Baltimore, Maryland, ${tail}` }); ctx = i; scrollEnd();
    }));
    setTimeout(() => addEventListener("click", function off(ev) { if (!box.contains(ev.target)) { box.remove(); removeEventListener("click", off); } }), 0);
  }

  document.getElementById("fold").addEventListener("click", (e) => { const w = document.getElementById("work"); w.classList.toggle("collapsed"); e.target.textContent = w.classList.contains("collapsed") ? "Show" : "Hide"; render(); });
  document.getElementById("ask").addEventListener("click", () => { const v = document.getElementById("q").value.trim(); if (!v) return; sheets.push({ kind: "pending", parent: ctx ?? undefined, typed: v, q: v }); document.getElementById("q").value = ""; scrollEnd(); });
  render();
</script>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Stage 2B decision workbook</title>
<style>
:root{--ink:#16181d;--dim:#5b6172;--line:#d8dbe3;--bg:#fbfbfd;--card:#fff;--warn:#8a5a00;--warnbg:#fff6e5;--ok:#1c6b4a;--okbg:#e9f4ee;--sug:#4a5878;--sugbg:#eef1f7;--alert:#8c2f1d;--alertbg:#fdefec}
*{box-sizing:border-box}
body{margin:0;font:15.5px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;z-index:5}
header b{font-size:14px}
.counts{color:var(--dim);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
main{max-width:820px;margin:0 auto;padding:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 22px;margin-bottom:16px}
.head{position:relative;padding-bottom:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 4px;font-weight:600}
h2{font-size:20px;line-height:1.35;margin:0 0 8px;font-weight:600}
.example{margin:0;font-size:14.5px;color:#39435c;background:var(--sugbg);border-left:3px solid var(--sug);padding:8px 12px;border-radius:0 4px 4px 0}
.example span{color:var(--dim);font-size:12.5px;display:block}
.head .observed{position:absolute;top:0;right:0}
.q{border-top:1px solid var(--line);padding:16px 0;margin-top:14px}
.q h3{font-size:16px;margin:0 0 6px}
.decide{margin:0 0 10px;font-size:14px;color:#39435c}
.decide b{color:var(--ink)}
.choices{margin:12px 0 4px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:600}
.q .hint{font-size:13.5px;color:var(--dim);margin:0 0 10px}
label.opt{display:block;border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin:6px 0;cursor:pointer}
label.opt:hover{background:#f7f8fb}
label.opt input{margin-right:9px}
label.opt .why{display:block;font-size:13px;color:var(--dim);margin:3px 0 0 24px}
.rec{background:var(--okbg);border-left:3px solid var(--ok);padding:10px 13px;margin:12px 0 0;border-radius:0 4px 4px 0;font-size:13.5px;color:#17513a}
.rec b{color:var(--ok)}
.recnote{display:block;font-size:12.5px;color:var(--dim);margin-top:4px}
input[type=text],textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:5px;font:inherit;background:#fff;margin-top:6px}
textarea{min-height:58px;resize:vertical}
details{margin:14px 0 0;font-size:13.5px}
details summary{cursor:pointer;color:var(--sug)}
details .body{background:var(--sugbg);border-left:3px solid var(--sug);padding:9px 12px;margin-top:6px;border-radius:0 4px 4px 0;color:#39435c}
details.technical{border-top:1px solid var(--line);padding-top:14px}
.observed{font-size:12.5px;color:var(--dim);font-style:italic}
.means{background:#fff;border:1px solid var(--line);border-radius:7px;padding:13px 15px;margin-top:6px}
.means dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.means dt{color:var(--dim);font-weight:600}
.means dd{margin:0}
.keptnote{color:var(--warn)}
.mapping{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.mapping dt{color:var(--dim)}
.mapping dd{margin:0}
.followup{background:var(--sugbg);border-left:3px solid var(--sug);padding:9px 12px;margin:10px 0;font-size:13.5px;color:#39435c;border-radius:0 4px 4px 0}
.warn{background:var(--warnbg);border-left:3px solid var(--warn);padding:9px 12px;margin:10px 0;font-size:13.5px;color:var(--warn);border-radius:0 4px 4px 0}
.alert{background:var(--alertbg);border-left:3px solid var(--alert);padding:9px 12px;margin:10px 0;font-size:13.5px;color:var(--alert);border-radius:0 4px 4px 0}
.good{background:var(--okbg);border-left:3px solid var(--ok);padding:9px 12px;margin:10px 0;font-size:13.5px;color:var(--ok);border-radius:0 4px 4px 0}
button{font:inherit;padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#dirty{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px}
#dirty.unsaved{background:var(--warnbg);color:var(--warn)}
#dirty.saved{background:var(--okbg);color:var(--ok)}
ul.affected{margin:8px 0 0;padding-left:20px;font-size:12.5px;max-height:190px;overflow:auto}
dialog{border:1px solid var(--line);border-radius:9px;padding:20px;max-width:640px}
code{font:12px ui-monospace,Menlo,monospace;background:#f2f3f7;padding:1px 4px;border-radius:3px;word-break:break-all}
</style></head><body>
<header>
 <b>Stage 2B decision workbook</b>
 <span id="dirty" class="saved"></span>
 <span class="counts" id="counts"></span>
 <span style="flex:1"></span>
 <select id="filter" style="width:auto;padding:6px 8px;border:1px solid var(--line);border-radius:5px"></select>
 <button id="import"></button>
 <button class="primary" id="export"></button>
 <input type="file" id="file" accept="application/json" hidden/>
</header>
<main>
 <div class="alert" id="staleness" hidden></div>
 <div class="warn" id="unsavedWarning"></div>
 <div id="card"></div>
 <div class="nav">
  <button id="prev"></button>
  <button id="next"></button>
  <button class="primary" id="nextUnanswered"></button>
  <button id="cluster"></button>
 </div>
</main>
<dialog id="confirm">
 <h3 id="clusterHeading"></h3>
 <p id="confirmIntro"></p>
 <p style="font-size:13px;color:#5b6172" id="clusterNote"></p>
 <ul class="affected" id="affected"></ul>
 <div class="nav"><button id="cancelCluster"></button><button class="primary" id="applyCluster"></button></div>

   */
  function yearRecommendation(cap) {
    const advice = CATALOG.yearAdvice(cap.id);
    if (!advice) return null;
    const option = QUESTIONS.year.options[advice.recommend === "yes" ? "years" : "no-years"];
    return { value: advice.recommend === "yes" ? "years" : "no-years", answer: advice.recommend === "yes" ? "Yes" : "No",
      label: option.label, why: advice.why };
  }

  function yearOptions(cap) {
    const recommended = yearRecommendation(cap);
    return ["years", "no-years", UNSURE].map((value) => ({
      value: value,
      label: QUESTIONS.year.options[value].label,
      consequence: QUESTIONS.year.options[value].consequence,
      recommended: !!recommended && recommended.value === value,
    }));
  }

  /** The failures worth asking about for THIS data, from the catalog rather than a generic set. */
  function trustScenarios(cap) {
    return CATALOG.scenarios(cap.id);
  }

  function availabilityOptions() {
    return ["always", "sometimes", UNSURE].map((value) => ({
      value: value,
      label: QUESTIONS.availability.options[value].label,
      consequence: QUESTIONS.availability.options[value].consequence,
    }));
  }

  /**
   * Only the update processes that could plausibly be contacted about THIS answer.
   *
   * Offering every process for the data source meant a policy owner had to open the technical
   * details to work out which one applied, which defeated the whole human-facing layer.
   */
  function responsibilityOptions(cap) {
    const processes = CATALOG.processLabels(cap.id);
    return processes.map((label) => ({ value: label, label: label }))
      .concat([{ value: "other", label: QUESTIONS.responsibility.otherOption },
        { value: UNSURE, label: QUESTIONS.responsibility.unsureLabel }]);
  }

  function blankAnswer() {
    return {
      coverage: null,
      integrity: [], integrityOther: "", integrityUnsure: false,
      availability: null, availabilityWhen: "",
      owner: null, ownerOther: "",
      evidence: "",
    };
  }

  const answered = (human) => !!human && (human.coverage !== null || human.availability !== null
    || human.owner !== null || (human.integrity || []).length > 0 || human.integrityUnsure
    || String(human.integrityOther || "").trim() !== "" || String(human.evidence || "").trim() !== "");

  /**
   * The technical policy a set of human answers WOULD produce.
   *
   * Returned for display and confirmation, never applied. "I'm not sure" produces null, which is the
   * fail-closed value: recorded as asked-and-open, authorising nothing.
   *
   * `followUps` names what is unresolved through no fault of the person answering. A year answer
   * with nothing dated to read is engineering's to close, and it still produces no policy -- open
   * either way, but the page must not tell someone they left a question open when they did not.
   */
  function proposeMapping(cap, human) {
    const h = human || blankAnswer();
    const proposed = { coverage: null, integrity: null, availability: null, receiptOwner: null, evidence: h.evidence || "" };
    const unresolved = [];
    const followUps = [];

    if (h.coverage === "years") {
      const basis = automaticYearBasis(cap);
      if (basis) proposed.coverage = { kind: "column", table: basis.table, yearColumn: basis.yearColumn };
      else { unresolved.push("coverage"); followUps.push("coverage"); }
    } else if (h.coverage === "no-years") {
      proposed.coverage = { kind: "none", reason: QUESTIONS.year.noneReason };
    } else unresolved.push("coverage");

    const rules = [];
    const catalog = trustScenarios(cap);
    for (const value of h.integrity || []) {
      const scenario = catalog.find((s) => s.value === value);
      if (scenario) rules.push(scenario.prose);
    }
    if (String(h.integrityOther || "").trim()) rules.push(String(h.integrityOther).trim());
    if (rules.length && !h.integrityUnsure) proposed.integrity = rules;
    else unresolved.push("integrity");

    if (h.availability === "always") proposed.availability = { kind: "always" };
    else if (h.availability === "sometimes") {
      proposed.availability = { kind: "conditional", condition: String(h.availabilityWhen || "").trim() };
    } else unresolved.push("availability");

    if (h.owner === "other") {
      const named = String(h.ownerOther || "").trim();
      if (named) proposed.receiptOwner = named; else unresolved.push("receiptOwner");
    } else if (h.owner && h.owner !== UNSURE) proposed.receiptOwner = h.owner;
    else unresolved.push("receiptOwner");

    return { proposed: proposed, unresolved: unresolved, followUps: followUps };
  }

  /**
   * What would actually be RECORDED: the new answers, over whatever is already there.
   *
   * An unresolved answer must not destroy an existing decision. The human controls start blank even
   * where policy already exists, so answering "I'm not sure" and citing evidence produced four
   * nulls -- and the importer wrote them over a complete existing entry and reported success. A
   * capability that had been decided became undecided, with no withdrawal and nothing named.
   *
   * So an unresolved field KEEPS what is there, and the page shows which fields are being kept
   * rather than set. Removing a decision stays a separate, named act: withdrawal, which names the
   * capability and asks for confirmation.
   */
  function mergeWithExisting(proposed, existing) {
    const prior = existing || null;
    const merged = {
      coverage: proposed.coverage, integrity: proposed.integrity,
      availability: proposed.availability, receiptOwner: proposed.receiptOwner,
      evidence: proposed.evidence || "",
    };
    const preserved = [];
    if (prior) {
      for (const field of ["coverage", "integrity", "availability", "receiptOwner"]) {
        if (merged[field] === null && prior[field] !== null && prior[field] !== undefined) {
          merged[field] = prior[field];
          preserved.push(field);
        }
      }
    }
    return { merged: merged, preserved: preserved };
  }

  /**
   * What the answers MEAN, in the words someone would use to describe the behaviour.
   *
   * The technical mapping says `{ kind: "column", table, yearColumn }`; this says the chatbot will
   * turn down a year it does not have. A person confirming the first is confirming a shape, not an
   * outcome -- so the outcome is what is put in front of them, and the shape stays one disclosure
   * away for whoever wants to check it.
   */
  function plainSummary(cap, human, merged, preserved, followUps) {
    const h = human || blankAnswer();
    const kept = preserved || [];
    const S = QUESTIONS.summary;
    const followed = (followUps || []).indexOf("coverage") >= 0;
    const rows = [];

    /**
     * A kept value is described, never quoted. See `summary.keptDetail`: what is already recorded
     * was written by someone else in their words, and pasting those words here is how database
     * language got back onto the deciding path.
     */
    const row = (field, label, text) => {
      const isKept = kept.indexOf(field) >= 0;
      rows.push({ field: field, label: label, text: isKept ? S.keptDetail : text,
        kept: isKept, followUp: false });
    };

    const yearText = followed ? QUESTIONS.year.followUp
      : h.coverage === "years" && merged.coverage ? S.year.years
      : h.coverage === "no-years" ? S.year["no-years"]
      : merged.coverage ? S.year[merged.coverage.kind === "none" ? "no-years" : "years"]
      : S.unanswered;
    if (kept.indexOf("coverage") >= 0) row("coverage", S.labels.year, yearText);
    else rows.push({ field: "coverage", label: S.labels.year, text: yearText, kept: false, followUp: followed });

    row("integrity", S.labels.trust, merged.integrity && merged.integrity.length
      ? S.trustPrefix + " " + merged.integrity.join(" ") + " " + S.trustNote
      : S.unanswered);

    row("availability", S.labels.availability, !merged.availability ? S.unanswered
      : merged.availability.kind === "always" ? S.availability.always
      : S.availability.sometimes.replace("%s", merged.availability.condition || "—"));

    row("receiptOwner", S.labels.responsibility,
      merged.receiptOwner ? S.responsibility.replace("%s", merged.receiptOwner) : S.unanswered);

    return rows;
  }

  /**
   * A stable digest of a proposal, so a confirmation can be tied to the EXACT mapping confirmed.
   *
   * FNV-1a over canonical JSON: deterministic, dependency-free, and identical in the page and at
   * the boundary. It detects a changed proposal, which is all it is asked to do -- if the human
   * answer moves after the mapping was confirmed, the confirmation no longer matches and the
   * importer refuses it as stale rather than importing a mapping nobody looked at.
   */
  function canonical(proposed) {
    const p = proposed || {};
    return JSON.stringify([p.coverage ?? null, p.integrity ?? null, p.availability ?? null,
      p.receiptOwner ?? null, p.evidence || ""]);
  }
  function mappingFingerprint(proposed) {
    const text = canonical(proposed);
    let hash = 0x811c9dc5;
    for (let i = 0; i < text.length; i++) {
      hash ^= text.charCodeAt(i);
      hash = (hash + ((hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24))) >>> 0;
    }
    return ("0000000" + hash.toString(16)).slice(-8);
  }

  return {
    UNSURE: UNSURE,
    tablePhrase: tablePhrase,
    describeQuestion: describeQuestion,
    exampleAsking: exampleAsking,
    automaticYearBasis: automaticYearBasis,
    yearRecommendation: yearRecommendation,
    yearOptions: yearOptions,
    trustScenarios: trustScenarios,
    availabilityOptions: availabilityOptions,
    responsibilityOptions: responsibilityOptions,
    blankAnswer: blankAnswer,
    isAnswered: answered,
    questions: () => QUESTIONS,
    plainSummary: plainSummary,
    /**
     * EVERYTHING a person would read for one capability, as data.
     *
     * The workbook fingerprint is taken over this for every capability, so any change to what is
     * asked, to the consequence attached to an answer, to the example, or to the recommendation and
     * its reason invalidates confirmations. All of them are read before deciding.
     */
    contractFor: (cap) => ({
      id: cap.id,
      question: describeQuestion(cap),
      example: exampleAsking(cap),
      recommendation: (() => { const r = yearRecommendation(cap); return r ? [r.value, r.answer, r.why] : null; })(),
      year: yearOptions(cap).map((o) => [o.value, o.label, o.consequence, !!o.recommended]),
      trust: trustScenarios(cap).map((s) => [s.value, s.label, s.prose]),
      availability: availabilityOptions().map((o) => [o.value, o.label, o.consequence]),
      responsibility: responsibilityOptions(cap).map((o) => [o.value, o.label]),
    }),
    proposeMapping: proposeMapping,
    mergeWithExisting: mergeWithExisting,
    mappingFingerprint: mappingFingerprint,
  };
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { createStage2bPlainLanguage: createStage2bPlainLanguage };
}


/**
 * The decision card: what a person actually reads, as markup built from data.
 *
 * WHY THIS IS A MODULE. Every word on this card used to be concatenated inside the generator's HTML
 * template, where the only thing a test could do was search the finished page for a substring. That
 * is how sixteen assertions passed over a page that threw on load, and it is why "does the primary
 * surface avoid database language?" was unanswerable: the page text and the inlined source code sat
 * in one string, so any search hit the code. Here the card is a function. The suite calls it and
 * reads back exactly what a person would see, with none of the machinery in the way.
 *
 * IT OWNS NO WORDING. Every sentence comes from `lib/stage2b-plain-language.js` or the reviewed
 * catalog, both of which the decision contract's fingerprint covers. A string written here would be
 * wording no confirmation was ever checked against.
 *
 * THE SPLIT THAT MATTERS. `primary` is the deciding path and speaks only about crime data and what
 * the chatbot will do. `technical` is a collapsed disclosure that speaks about tables and columns,
 * is never required to answer anything, and is marked so the regression can hold the two apart.
 */
function createStage2bCard(plainLanguage) {
  const PL = plainLanguage;
  const Q = PL.questions();

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
  }

  /** A question heading with the one-sentence statement of what is being decided under it. */
  function ask(heading, decision) {
    return '<h3>' + esc(heading) + '</h3>'
      + '<p class="decide"><b>' + esc(Q.card.decisionHeading) + '</b> ' + esc(decision) + '</p>';
  }

  /**
   * An option, with what it CAUSES under it.
   *
   * The consequence is not decoration. A label alone ("Yes — year matters") tells someone what they
   * are ticking, not what the chatbot will then do, and the whole point of the exercise is the
   * second thing.
   */
  function option(type, name, o, checked) {
    return '<label class="opt"><input type="' + type + '" name="' + name + '" value="' + esc(o.value) + '"'
      + (checked ? " checked" : "") + "/>" + esc(o.label)
      + '<span class="why">' + esc(o.consequence) + "</span></label>";
  }

  /**
   * The recommendation, in its own block and never on the option.
   *
   * Fusing them ("No — this question is not about a particular year  recommended") reads as one
   * label and makes the recommendation look like part of the choice rather than advice about it.
   * Kept apart, with its capability-specific reason, it can be disagreed with.
   */
  function recommendation(cap) {
    const r = PL.yearRecommendation(cap);
    if (!r) return "";
    return '<div class="rec"><b>' + esc(Q.card.recommendationLabel) + ": " + esc(r.answer) + ".</b> "
      + esc(r.why) + '<span class="recnote">' + esc(Q.card.recommendationNote) + "</span></div>";
  }

  /** What this question helps someone answer, and one realistic asking of it. */
  function header(cap, position) {
    return '<div class="head">'
      + '<p class="eyebrow">' + esc(Q.card.answersHeading) + "</p>"
      + "<h2>" + esc(PL.describeQuestion(cap)) + "</h2>"
      + '<p class="example"><span>' + esc(Q.card.exampleLabel) + "</span> “"
      + esc(PL.exampleAsking(cap)) + "”</p>"
      + (position ? '<span class="observed">' + esc(position) + "</span>" : "")
      + "</div>";
  }

  /** The deciding path. Nothing here requires knowing anything about how the data is stored. */
  function primary(cap, S, position) {
    const h = S.human(cap.id);
    const years = PL.yearOptions(cap).map((o) => option("radio", "cov", o, h.coverage === o.value)).join("");
    const scenarios = PL.trustScenarios(cap).map((s) =>
      '<label class="opt"><input type="checkbox" name="integ" value="' + esc(s.value) + '"'
      + ((h.integrity || []).indexOf(s.value) >= 0 ? " checked" : "") + "/>" + esc(s.label) + "</label>").join("");
    const avail = PL.availabilityOptions().map((o) => option("radio", "avail", o, h.availability === o.value)).join("");
    const who = PL.responsibilityOptions(cap).map((o) =>
      '<label class="opt"><input type="radio" name="owner" value="' + esc(o.value) + '"'
      + (h.owner === o.value ? " checked" : "") + "/>" + esc(o.label) + "</label>").join("");

    return '<div class="card">'
      + header(cap, position)

      + '<div class="q">' + ask(Q.year.heading, Q.year.decision)
        + '<p class="choices">' + esc(Q.card.choicesHeading) + "</p>"
        + years + recommendation(cap)
      + "</div>"

      + '<div class="q">' + ask(Q.trust.heading, Q.trust.decision)
        + scenarios
        + '<label class="opt"><input type="checkbox" id="integUnsure"' + (h.integrityUnsure ? " checked" : "") + "/>"
        + esc(Q.trust.unsureLabel) + '<span class="why">' + esc(Q.trust.unsureConsequence) + "</span></label>"
        + "<label>" + esc(Q.trust.otherLabel) + "</label>"
        + '<input type="text" id="integOther" value="' + esc(h.integrityOther || "") + '"/>'
      + "</div>"

      + '<div class="q">' + ask(Q.availability.heading, Q.availability.decision)
        + '<p class="choices">' + esc(Q.card.choicesHeading) + "</p>"
        + avail
        + (h.availability === "sometimes"
          ? "<label>" + esc(Q.availability.whenLabel) + "</label>"
            + '<p class="hint">' + esc(Q.availability.whenHint) + "</p>"
            + '<input type="text" id="availWhen" value="' + esc(h.availabilityWhen || "") + '"/>'
          : "")
      + "</div>"

      + '<div class="q">' + ask(Q.responsibility.heading, Q.responsibility.decision)
        + who
        + (h.owner === "other"
          ? "<label>" + esc(Q.responsibility.otherLabel) + '</label><input type="text" id="ownerOther" value="'
            + esc(h.ownerOther || "") + '"/>'
          : "")
      + "</div>"

      + '<div class="q"><h3>' + esc(Q.evidence.heading) + "</h3>"
        + '<p class="hint">' + esc(Q.evidence.hint) + "</p>"
        + '<textarea id="evidence">' + esc(h.evidence || "") + "</textarea></div>"

      + '<div id="summary"></div>'

      + (S.canWithdraw(cap.id)
        ? '<div class="q"><h3>' + esc(Q.withdraw.heading) + "</h3>"
          + '<p class="hint">' + esc(Q.withdraw.hint) + "</p>"
          + (S.isWithdrawn(cap.id)
            ? '<div class="alert">' + esc(Q.withdraw.marked) + "</div>"
            : '<button id="withdraw">' + esc(Q.withdraw.button) + "</button>")
          + "</div>"
        : "")

      + technical(cap, S)
      + "</div>";
  }

  /**
   * What your answers mean: the behaviour, before any confirmation.
   *
   * Repainted on its own as the person types, because it used to be rebuilt only when a radio
   * changed -- so typing the missing sentence cleared the problem while the confirm button stayed
   * greyed out, with nothing saying why.
   */
  function summaryPanel(cap, S) {
    const rows = S.summary(cap.id);
    const problems = S.problems(cap.id);
    const confirmed = S.isMappingConfirmed(cap.id);
    const answered = PL.isAnswered(S.human(cap.id));
    const followUps = S.proposal(cap.id).followUps;

    /** A kept row already says it is kept, in `summary.keptDetail`. Marking it again just repeats. */
    const body = rows.map((row) =>
      "<dt>" + esc(row.label) + "</dt><dd"
      + (row.kept ? ' class="keptnote"' : "") + ">" + esc(row.text) + "</dd>").join("");

    return '<div class="q"><h3>' + esc(Q.summary.heading) + "</h3>"
      + '<p class="hint">' + esc(Q.summary.hint) + "</p>"
      + '<div class="means"><dl>' + body + "</dl></div>"
      + (followUps.length
        ? '<div class="followup"><b>' + esc(Q.card.followUpHeading) + "</b> " + esc(Q.year.followUp) + "</div>"
        : "")
      + (problems.length
        ? '<div class="alert">' + esc(Q.summary.beforeConfirm) + " " + problems.map(esc).join("; ") + "</div>"
        : "")
      + (S.needsReconfirmation(cap.id) ? '<div class="warn">' + esc(Q.summary.reworded) + "</div>" : "")
      + (confirmed
        ? '<div class="good">' + esc(Q.summary.confirmedNote) + "</div>"
        : '<button class="primary" id="confirmMapping"' + (answered && !problems.length ? "" : " disabled") + ">"
          + esc(Q.summary.confirmLabel) + "</button>")
      + "</div>";
  }

  /**
   * The collapsed disclosure. The ONLY place database language is allowed.
   *
   * `class="technical"` is load-bearing: the regression strips exactly this element and then holds
   * the rest of the card to a vocabulary a non-technical reader can follow. Without a marked
   * boundary the two surfaces are one string and the rule cannot be checked at all.
   */
  function technical(cap, S) {
    const p = S.proposal(cap.id);
    const m = p.merged;
    const line = (label, value) => "<dt>" + esc(label) + "</dt><dd>" + value + "</dd>";
    const rows = [
      line("Coverage basis", m.coverage === null ? "<i>left open</i>"
        : m.coverage.kind === "none" ? "no year dimension &mdash; " + esc(m.coverage.reason)
        : "<code>" + esc(m.coverage.table + "." + m.coverage.yearColumn) + "</code>"),
      line("Integrity rules", m.integrity === null ? "<i>left open</i>"
        : '<ul style="margin:0;padding-left:16px">' + m.integrity.map((r) => "<li>" + esc(r) + "</li>").join("") + "</ul>"),
      line("Availability", m.availability === null ? "<i>left open</i>"
        : m.availability.kind === "always" ? "always expected"
        : "conditional &mdash; " + esc(m.availability.condition)),
      line("Receipt owner", m.receiptOwner === null ? "<i>left open</i>" : esc(m.receiptOwner)),
    ].join("");

    return '<details class="technical"><summary>' + esc(Q.card.technicalHeading) + "</summary>"
      + '<div class="body">'
      + "<p>" + esc(Q.card.technicalNote) + "</p>"
      + "Identifier <code>" + esc(cap.id) + "</code><br/>"
      + "Data source <code>" + esc(cap.artifact) + "</code><br/>"
      + "Reads " + cap.reads.map((t) => "<code>" + esc(t) + "</code>").join(" ")
      + "<br/>Columns: " + Object.keys(cap.columns).map((t) =>
        esc(t) + " (" + cap.columns[t].map(esc).join(", ") + ")").join(" &middot; ")
      + (cap.ownerCandidates.length
        ? "<br/>Scripts mentioning every one of these tables (a filename search, not an answer): "
          + cap.ownerCandidates.map((o) => "<code>" + esc(o) + "</code>").join(" ")
        : "")
      + (cap.conditionalHint ? '<p class="observed">Observed: ' + esc(cap.conditionalHint) + "</p>" : "")
      + '<p class="observed">Recorded mapping</p><dl class="mapping">' + rows + "</dl>"
      + "</div></details>";
  }

  return { primary: primary, summaryPanel: summaryPanel, technical: technical, esc: esc };
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { createStage2bCard: createStage2bCard };
}


/**
 * The Stage 2B workbook's decision state, as one testable unit.
 *
 * Plain browser-compatible JavaScript on purpose. This file is inlined VERBATIM into the generated
 * workbook page and imported directly by the regression suite, so the logic under test is byte-for-
 * byte the logic that ships. It previously lived inside the HTML string, where the only thing a test
 * could do was match its text -- and sixteen text assertions passed over a page that threw a
 * SyntaxError on load and rendered nothing. Text matching cannot see behaviour; this can be called.
 *
 * WHAT IS STORED IS THE HUMAN ANSWER. The technical policy is DERIVED from it, shown, and applied
 * only after the person confirms that exact derivation. Storing the technical form instead would
 * make the translation invisible: the record would show a coverage basis nobody chose in those
 * terms, and no later reader could tell what question had actually been answered.
 *
 * It owns no DOM. Nothing here can reach the repository, a database, or any flag.
 */
function createStage2bSession(DATA, plainLanguage) {
  const PL = plainLanguage || createStage2bPlainLanguage();
  const clone = (value) => (value === null || value === undefined ? null : JSON.parse(JSON.stringify(value)));
  const POLICY_FIELDS = ["coverage", "integrity", "availability", "receiptOwner"];

  const human = {};
  const confirmed = {};
  const withdrawn = {};
  const capabilityById = {};
  /**
   * What the policy source held when this session began, and an immutable copy of it.
   *
   * `baseline` may legitimately be replaced by the one a loaded file was authored against, which
   * made it stale-able: loading an older session moved it, and a second, empty load then restored
   * the moved value instead of the repository's. Every load resets both from `repositoryBaseline`.
   */
  const baseline = {};
  const repositoryBaseline = {};
  /**
   * What the checked-in answer record held when this session began, and never written to.
   *
   * Seeding from it is the resume feature: reopening the workbook shows what was answered and why,
   * instead of a blank card over existing policy. A capability nobody has answered still opens
   * blank -- seeding must never invent an answer, only restore one.
   */
  const repositoryAnswers = {};
  /**
   * The AUTHORED ENTRY each capability held when this session began, as an opaque digest.
   *
   * Separate from `baseline`, which is the derived policy and exists so an unresolved answer can
   * keep what is already recorded. This one exists for a different job: telling the importer what
   * this session was authored on top of, so a second export cannot silently replace someone else's
   * answer. The derived policy cannot do that job -- an unconfirmed answer derives nothing, and two
   * different answers can derive the same thing.
   */
  const recordBaseline = {};
  const repositoryEntryDigest = {};
  /**
   * Capabilities whose question has been RE-WORDED since the answer was recorded.
   *
   * The answer is restored -- it is still what the person said -- but its confirmation is not, and
   * the page says why. A confirmation approves a specific translation of a specific question; once
   * the question changes it approves something nobody read.
   */
  const rewordedSince = {};
  const recorded = DATA.answers || {};
  const digests = DATA.entryDigests || {};
  for (const cap of DATA.capabilities) {
    capabilityById[cap.id] = cap;
    const prior = DATA.authored[cap.id] ? clone(DATA.authored[cap.id]) : null;
    repositoryBaseline[cap.id] = prior;
    baseline[cap.id] = clone(prior);
    repositoryEntryDigest[cap.id] = digests[cap.id] || "absent";
    recordBaseline[cap.id] = repositoryEntryDigest[cap.id];
    const priorAnswer = recorded[cap.id] || null;
    /**
     * Compared against the SAME identity the answer was recorded under. These were two different
     * fingerprints under two names -- the answer carried the full decision contract and this
     * compared it against the catalog-only digest -- so no restored confirmation ever survived,
     * and the page asked every returning author to re-confirm work they had already confirmed.
     */
    const sameWording = !!priorAnswer && priorAnswer.contractFingerprint === DATA.contractFingerprint;
    if (priorAnswer && !sameWording) rewordedSince[cap.id] = true;
    repositoryAnswers[cap.id] = priorAnswer ? clone(priorAnswer) : null;
    human[cap.id] = priorAnswer ? Object.assign(PL.blankAnswer(), priorAnswer.human || {}) : PL.blankAnswer();
    confirmed[cap.id] = sameWording ? (priorAnswer.mappingConfirmed || null) : null;
  }

  let dirty = false;

  /**
   * What would actually be RECORDED for this capability. Never applied by anything here.
   *
   * `merged` is what the importer will write: the answers, over whatever the policy source already
   * holds. An unresolved answer keeps the existing value rather than nulling it, so "I'm not sure"
   * cannot quietly undo a decision someone made -- and `preserved` names the fields that are being
   * kept rather than set, because a mapping panel that showed them as blank would be describing a
   * different outcome than the one about to happen.
   */
  function proposal(id) {
    const p = PL.proposeMapping(capabilityById[id], human[id]);
    const m = PL.mergeWithExisting(p.proposed, baseline[id]);
    return { proposed: p.proposed, unresolved: p.unresolved, followUps: p.followUps || [],
      merged: m.merged, preserved: m.preserved };
  }
  /** The answers as behaviour, in ordinary words. What the person confirms is this, not the shape. */
  function summary(id) {
    const p = proposal(id);
    return PL.plainSummary(capabilityById[id], human[id], p.merged, p.preserved, p.followUps);
  }
  /** Over the MERGED result, so the person confirms what will be written, not an intermediate. */
  function fingerprintOf(id) { return PL.mappingFingerprint(proposal(id).merged); }

  /**
   * A confirmation is tied to the EXACT proposal confirmed, so it expires by itself.
   *
   * Storing a boolean would have let an answer change after the mapping was approved and carried
   * the approval along with it -- the person would have confirmed one translation and exported
   * another. Comparing fingerprints means any edit that changes the proposal silently un-confirms
   * it, and the page says so.
   */
  function isMappingConfirmed(id) { return confirmed[id] !== null && confirmed[id] === fingerprintOf(id); }
  function confirmMapping(id) {
    if (!PL.isAnswered(human[id])) return false;
    confirmed[id] = fingerprintOf(id);
    dirty = true;
    return true;
  }

  /**
   * What is still missing FROM THE PERSON, phrased as the thing they would go and do.
   *
   * Only things they can actually supply. It used to ask them to justify a column whose name did
   * not look like a year, which is not a judgment anyone outside engineering could make; a question
   * with nothing dated to read is now engineering's follow-up and never appears here.
   */
  function problems(id) {
    const h = human[id], found = [];
    if (h.availability === "sometimes" && !String(h.availabilityWhen || "").trim()) {
      found.push("say when it is fine for this to be unavailable");
    }
    if (h.owner === "other" && !String(h.ownerOther || "").trim()) found.push("say who should be contacted");
    if (PL.isAnswered(h) && String(h.evidence || "").trim().length <= 20) {
      found.push("say how you know these answers are right");
    }
    return found;
  }

  /** Answered throughout, coherent, cited, and with the technical mapping confirmed. */
  function isComplete(id) {
    const p = proposal(id);
    return p.unresolved.length === 0 && problems(id).length === 0 && isMappingConfirmed(id);
  }

  function update(id, patch) {
    const before = JSON.stringify(human[id]);
    for (const key of Object.keys(patch)) human[id][key] = patch[key];
    const changed = JSON.stringify(human[id]) !== before;
    if (changed) { dirty = true; delete withdrawn[id]; }
    return changed;
  }

  function counts() {
    const c = { coverage: 0, integrity: 0, availability: 0, receiptOwner: 0, complete: 0, problems: 0, unconfirmed: 0 };
    for (const cap of DATA.capabilities) {
      const p = proposal(cap.id);
      for (const f of POLICY_FIELDS) if (p.unresolved.indexOf(f) >= 0) c[f] += 1;
      if (isComplete(cap.id)) c.complete += 1;
      if (problems(cap.id).length) c.problems += 1;
      if (PL.isAnswered(human[cap.id]) && !isMappingConfirmed(cap.id)) c.unconfirmed += 1;
    }
    return c;
  }

  /**
   * Withdrawing authored policy is a NAMED act, never inferred from empty fields.
   *
   * Clearing every answer used to be read as deletion at the importer, while the page offered only
   * "not sure" and no confirmation -- so "I have not decided this" and "remove what was decided"
   * were the same gesture, and the destructive reading won.
   */
  function canWithdraw(id) { return baseline[id] !== null && baseline[id] !== undefined; }
  function withdraw(id) {
    if (!canWithdraw(id)) return false;
    withdrawn[id] = true;
    human[id] = PL.blankAnswer();
    confirmed[id] = null;
    dirty = true;
    return true;
  }
  const isWithdrawn = (id) => withdrawn[id] === true;

  /**
   * Only what this session changed, carrying the human answer AND the mapping it proposes.
   *
   * Both, always. The human answer is the decision and the record of what was actually asked; the
   * proposal is what the importer will write. Exporting only one of them would either hide the
   * translation or lose the question it answered.
   */
  function changeSet() {
    const out = {};
    for (const id of Object.keys(human).sort()) {
      if (withdrawn[id]) { out[id] = { operation: "withdraw" }; continue; }
      if (!PL.isAnswered(human[id])) continue;
      /**
       * An answer restored from the record and left alone is not a change.
       *
       * Without this every seeded capability would reappear in the change set on every export, so a
       * diff of two sessions would show fifty untouched entries and hide the one that moved.
       */
      const seeded = rewordedSince[id] ? null : repositoryAnswers[id];
      if (seeded && JSON.stringify(seeded.human || {}) === JSON.stringify(human[id])
          && (seeded.mappingConfirmed || null) === (isMappingConfirmed(id) ? confirmed[id] : null)) continue;
      const p = proposal(id);
      out[id] = {
        human: clone(human[id]),
        /** What will be RECORDED, which is what was shown and confirmed. */
        proposed: p.merged,
        unresolved: p.unresolved.slice(),
        preserved: p.preserved.slice(),
        mappingConfirmed: isMappingConfirmed(id) ? confirmed[id] : null,
      };
    }
    return out;
  }

  function serialize() {
    const changed = changeSet();
    const basedOn = {};
    /** The authoritative baseline: the RECORD entry, not what it derives. */
    const basedOnEntry = {};
    for (const id of Object.keys(changed)) {
      basedOn[id] = baseline[id] === null ? null : clone(baseline[id]);
      basedOnEntry[id] = recordBaseline[id];
    }
    return JSON.stringify({
      v: DATA.v, contractFingerprint: DATA.contractFingerprint, decisions: changed, basedOn, basedOnEntry,
    }, null, 2) + "\n";
  }

  /**
   * Loading REPLACES the session; it does not merge into whatever is on screen.
   *
   * Merging looked harmless and was not: unrelated edits made in this tab survived the load and were
   * then marked clean along with the file's, so an export afterwards carried work the author never
   * saw on screen. A session authored against a DIFFERENT registry structure applies nothing at all
   * -- warning and copying anyway meant the next export stamped those answers with the CURRENT
   * fingerprint, and the check that refused the file accepted its laundered copy.
   */
  function loadSession(parsed, options) {
    const opts = options || {};
    if (!parsed || typeof parsed !== "object") return { ok: false, reason: "that file is not a workbook session" };
    if (parsed.v !== DATA.v) {
      return { ok: false, reason: "that session is version " + String(parsed.v) + "; this workbook writes version " + String(DATA.v) };
    }
    if (parsed.contractFingerprint !== DATA.contractFingerprint) {
      return {
        ok: false, stale: true,
        reason: "That session was authored against a different registry structure (" + String(parsed.contractFingerprint)
          + " vs " + DATA.contractFingerprint + "), so the questions themselves may have changed. Nothing was loaded."
          + " Re-answer against this workbook rather than carrying the old answers across.",
      };
    }
    if (dirty && !opts.discardUnsaved) {
      return {
        ok: false, needsConfirmation: true,
        reason: "This tab has unsaved changes. Loading a session replaces everything on screen with"
          + " the file's contents. Export first, or confirm to discard what is unsaved.",
      };
    }

    for (const id of Object.keys(human)) {
      baseline[id] = clone(repositoryBaseline[id]);
      recordBaseline[id] = repositoryEntryDigest[id];
      const seeded = repositoryAnswers[id];
      human[id] = seeded ? Object.assign(PL.blankAnswer(), seeded.human || {}) : PL.blankAnswer();
      confirmed[id] = seeded && !rewordedSince[id] ? (seeded.mappingConfirmed || null) : null;
      delete withdrawn[id];
    }
    const incoming = parsed.decisions || {};
    const unknown = [];
    let applied = 0;
    for (const id of Object.keys(incoming)) {
      if (!human[id]) { unknown.push(id); continue; }
      const entry = incoming[id] || {};
      if (entry.operation === "withdraw") { withdrawn[id] = true; }
      else {
        human[id] = Object.assign(PL.blankAnswer(), entry.human || {});
        // A confirmation only survives if it still matches what these answers propose NOW.
        confirmed[id] = entry.mappingConfirmed || null;
      }
      if (parsed.basedOn && Object.prototype.hasOwnProperty.call(parsed.basedOn, id)) {
        baseline[id] = parsed.basedOn[id] === null ? null : clone(parsed.basedOn[id]);
      }
      /**
       * The file's record baseline travels with it, and is NOT refreshed to this page's.
       *
       * Adopting the current one here would launder a stale session: an export made before someone
       * else's answer landed would come back claiming to have been authored on top of it, and the
       * importer's conflict check -- the whole point of carrying a baseline -- would pass.
       */
      if (parsed.basedOnEntry && Object.prototype.hasOwnProperty.call(parsed.basedOnEntry, id)) {
        recordBaseline[id] = parsed.basedOnEntry[id];
      }
      applied += 1;
    }
    dirty = false;
    return { ok: true, applied: applied, unknown: unknown };
  }

  /** Which capabilities a cluster application would touch, and what it would cost them. */
  function clusterPlan(id) {
    const cap = capabilityById[id];
    const targets = cap.tableCluster.length ? cap.tableCluster.slice() : cap.artifactCluster.slice();
    /**
     * A KEY, not a sentence. This returned "the same tables", which the copy dialog then showed to
     * the person -- so the one bit of the deciding path that did not come from the contract was
     * also the one still speaking about the database.
     */
    const scope = cap.tableCluster.length ? "sameRecords" : "sameSource";
    const detail = targets.map((t) => ({
      id: t,
      overwrites: PL.isAnswered(human[t]),
      /**
       * A copied answer proposes a DIFFERENT mapping for a different capability, so the target's
       * confirmation cannot survive: it approved a translation that no longer applies.
       */
      confirmationCleared: confirmed[t] !== null,
    }));
    return { targets: targets, scope: scope, detail: detail, answered: PL.isAnswered(human[id]) };
  }

  function applyCluster(id) {
    const plan = clusterPlan(id);
    const changed = [];
    if (!plan.answered) return { changed: changed };
    for (const entry of plan.detail) {
      /**
       * The whole answer copies across. It carries no database choice any more -- what a year
       * answer is bounded by is worked out for each question separately -- so there is nothing here
       * that could be true of one question and false of the next.
       */
      human[entry.id] = clone(human[id]);
      confirmed[entry.id] = null;      // the mapping differs; it must be looked at again
      delete withdrawn[entry.id];
      changed.push(entry.id);
      dirty = true;
    }
    return { changed: changed };
  }

  return {
    POLICY_FIELDS: POLICY_FIELDS,
    capability: (id) => capabilityById[id],
    human: (id) => human[id],
    update: update,
    proposal: proposal,
    summary: summary,
    mappingFingerprint: fingerprintOf,
    isMappingConfirmed: isMappingConfirmed,
    /** True when the answer was restored but the question has been re-worded since. */
    needsReconfirmation: (id) => rewordedSince[id] === true && PL.isAnswered(human[id]),
    confirmMapping: confirmMapping,
    problems: problems,
    isComplete: isComplete,
    counts: counts,
    changeSet: changeSet,
    serialize: serialize,
    loadSession: loadSession,
    clusterPlan: clusterPlan,
    applyCluster: applyCluster,
    canWithdraw: canWithdraw,
    withdraw: withdraw,
    isWithdrawn: isWithdrawn,
    isDirty: () => dirty,
    markClean: () => { dirty = false; },
    baselineFor: (id) => baseline[id],
    /** The authored entry this session began from, as carried into the export. */
    recordBaselineFor: (id) => recordBaseline[id],
  };
}

if (typeof module !== "undefined" && module.exports) module.exports = { createStage2bSession: createStage2bSession };


const PL = createStage2bPlainLanguage(stage2bCapabilityCatalog());
/* Every word on the page comes from the contract the fingerprint covers, never from this template. */
const Q = PL.questions();
const P = Q.page;
const Card = createStage2bCard(PL);
const S = createStage2bSession(DATA, PL);
let index = 0;

function esc(s){ return Card.esc(s); }

/* Chrome text, from the contract like everything else. */
document.getElementById("filter").innerHTML =
  [["all",P.filters.all],["unanswered",P.filters.unanswered],["unconfirmed",P.filters.unconfirmed],
   ["problems",P.filters.problems],["followUp",P.filters.followUp]]
  .map(([v,l]) => '<option value="'+esc(v)+'">'+esc(l)+'</option>').join('');
document.getElementById("import").textContent = P.buttons.load;
document.getElementById("export").textContent = P.buttons.exportAnswers;
document.getElementById("prev").textContent = P.buttons.prev;
document.getElementById("next").textContent = P.buttons.next;
document.getElementById("nextUnanswered").textContent = P.buttons.nextUnanswered;
document.getElementById("cluster").textContent = P.buttons.cluster;
document.getElementById("unsavedWarning").textContent = P.unsavedWarning;
document.getElementById("clusterHeading").textContent = P.cluster.heading;
document.getElementById("clusterNote").textContent = P.cluster.note;
document.getElementById("cancelCluster").textContent = P.cluster.cancel;
document.getElementById("applyCluster").textContent = P.cluster.apply;

function matches(cap){
  const f = document.getElementById("filter").value;
  if (f === "all") return true;
  if (f === "unanswered") return !PL.isAnswered(S.human(cap.id));
  if (f === "unconfirmed") return PL.isAnswered(S.human(cap.id)) && !S.isMappingConfirmed(cap.id);
  if (f === "problems") return S.problems(cap.id).length > 0;
  if (f === "followUp") return S.proposal(cap.id).followUps.length > 0;
  return true;
}
function visible(){ const v = DATA.capabilities.filter(matches); return v.length ? v : DATA.capabilities; }

function status(){
  const c = S.counts();
  document.getElementById("counts").innerHTML =
    '<span>'+esc(P.counts.finished)+': <b>'+c.complete+'</b>/'+DATA.capabilities.length+'</span>'+
    '<span>'+esc(P.counts.awaiting)+': <b>'+c.unconfirmed+'</b></span>'+
    (c.problems?'<span>'+esc(P.counts.needsFixing)+': <b>'+c.problems+'</b></span>':'');
  const badge = document.getElementById("dirty");
  const changed = Object.keys(S.changeSet()).length;
  if (S.isDirty()){ badge.className = "unsaved"; badge.textContent = P.dirty.unsaved; }
  else { badge.className = "saved"; badge.textContent = changed ? P.dirty.saved.replace("%s", changed) : P.dirty.nothing; }
}

function render(){
  const list = visible();
  if (index >= list.length) index = 0;
  const cap = list[index];

  document.getElementById("card").innerHTML = Card.primary(cap, S, (index+1)+' of '+list.length);

  const value = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };
  /**
   * The summary repaints on every edit, in place.
   *
   * It used to be part of the card, which is only rebuilt when a radio changes -- so typing the
   * missing sentence cleared the problem, and the confirm button stayed greyed out with no way to
   * press it. Repainting only this panel keeps the cursor where the person is typing.
   */
  const renderSummary = () => {
    const host = document.getElementById("summary");
    if (!host) return;
    host.innerHTML = Card.summaryPanel(cap, S);
    const button = document.getElementById("confirmMapping");
    if (button) button.addEventListener("click", () => { S.confirmMapping(cap.id); status(); renderSummary(); });
  };
  const save = () => {
    const covRadio = document.querySelector('input[name=cov]:checked');
    const availRadio = document.querySelector('input[name=avail]:checked');
    const ownerRadio = document.querySelector('input[name=owner]:checked');
    S.update(cap.id, {
      coverage: covRadio ? covRadio.value : null,
      integrity: Array.prototype.slice.call(document.querySelectorAll('input[name=integ]:checked')).map((e)=>e.value),
      integrityOther: value("integOther"),
      integrityUnsure: !!(document.getElementById("integUnsure") || {}).checked,
      availability: availRadio ? availRadio.value : null,
      availabilityWhen: value("availWhen"),
      owner: ownerRadio ? ownerRadio.value : null,
      ownerOther: value("ownerOther"),
      evidence: value("evidence"),
    });
    status();
    renderSummary();
  };
  /* Radios re-render, because which follow-up field is asked depends on the choice. */
  for (const name of ["cov","avail","owner"]){
    Array.prototype.slice.call(document.querySelectorAll('input[name='+name+']')).forEach((el) => {
      el.addEventListener("change", () => { save(); render(); });
    });
  }
  for (const id of ["integOther","availWhen","ownerOther","evidence"]){
    const el = document.getElementById(id); if (el) el.addEventListener("input", save);
  }
  Array.prototype.slice.call(document.querySelectorAll('input[name=integ]')).forEach((el) => {
    el.addEventListener("change", () => { save(); render(); });
  });
  const unsure = document.getElementById("integUnsure");
  if (unsure) unsure.addEventListener("change", () => { save(); render(); });

  renderSummary();

  const withdrawButton = document.getElementById("withdraw");
  if (withdrawButton) withdrawButton.addEventListener("click", () => {
    if (!confirm(Q.withdraw.confirm+"\n\n"+PL.describeQuestion(cap)+"\n\n"+Q.withdraw.confirmDetail)) return;
    S.withdraw(cap.id); status(); render();
  });
  status();
}

document.getElementById("filter").addEventListener("change", () => { index = 0; render(); });
document.getElementById("prev").addEventListener("click", () => { const l=visible(); index=(index-1+l.length)%l.length; render(); });
document.getElementById("next").addEventListener("click", () => { const l=visible(); index=(index+1)%l.length; render(); });
document.getElementById("nextUnanswered").addEventListener("click", () => {
  const l = visible();
  for (let step=1; step<=l.length; step++){
    const probe=(index+step)%l.length;
    if (!PL.isAnswered(S.human(l[probe].id))){ index=probe; render(); return; }
  }
  alert(P.allAnswered);
});

/* Copying names EVERY affected question, and what it costs them, before anything changes. */
document.getElementById("cluster").addEventListener("click", () => {
  const cap = visible()[index];
  const plan = S.clusterPlan(cap.id);
  document.getElementById("confirmIntro").textContent = plan.answered
    ? P.cluster.intro.replace("%n", plan.targets.length).replace("%s", P.cluster.scope[plan.scope])
    : P.cluster.none;
  document.getElementById("affected").innerHTML = plan.detail.map((entry) => {
    const notes = [];
    if (entry.overwrites) notes.push(P.cluster.overwrites);
    if (entry.confirmationCleared) notes.push(P.cluster.cleared);
    const named = S.capability(entry.id);
    return '<li>'+esc(PL.describeQuestion(named))+(notes.length?' <b style="color:#8a5a00">— '+esc(notes.join("; "))+'</b>':'')+'</li>';
  }).join('') || '<li>(none)</li>';
  document.getElementById("applyCluster").disabled = !plan.answered || !plan.targets.length;
  document.getElementById("confirm").showModal();
});
document.getElementById("cancelCluster").addEventListener("click", () => document.getElementById("confirm").close());
document.getElementById("applyCluster").addEventListener("click", () => {
  S.applyCluster(visible()[index].id);
  document.getElementById("confirm").close();
  status(); render();
});

document.getElementById("export").addEventListener("click", () => {
  const blob = new Blob([S.serialize()], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "stage2b-policy-decisions.json"; a.click();
  URL.revokeObjectURL(a.href);
  S.markClean();
  status();
});
document.getElementById("import").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("file").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const note = document.getElementById("staleness");
    let parsed; try { parsed = JSON.parse(reader.result); } catch { note.hidden = false; note.textContent = "That file is not JSON. Nothing was loaded."; return; }
    let result = S.loadSession(parsed);
    /* Loading REPLACES the session, so unsaved work has to be given up deliberately. */
    if (!result.ok && result.needsConfirmation){
      if (!confirm(result.reason)) { note.hidden = false; note.textContent = "Nothing was loaded; your unsaved answers are still here."; return; }
      result = S.loadSession(parsed, { discardUnsaved: true });
    }
    if (!result.ok){ note.hidden = false; note.textContent = result.reason; index = 0; status(); render(); return; }
    note.hidden = result.unknown.length === 0;
    if (result.unknown.length) note.textContent = "Loaded "+result.applied+" question(s). "+
      result.unknown.length+" entry(ies) in that file are not questions in this workbook and were ignored.";
    index = 0; status(); render();
  };
  reader.readAsText(f);
});

/* Only when there is something to lose. A guard that always fires is one people learn to dismiss. */
window.addEventListener("beforeunload", (e) => {
  if (!S.isDirty()) return;
  e.preventDefault();
  e.returnValue = "";
  return "";
});
render();
</script></body></html>
